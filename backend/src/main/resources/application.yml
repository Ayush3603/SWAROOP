spring:
  application:
    name: swaruoop-pay
  server:
    port: 8080
    servlet:
      context-path: /
    cors:
      allowed-origin-patterns: "http://localhost:5173"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true
  datasource:
    url: jdbc:h2:mem:swaruoop-pay
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  face:
    matching-threshold: 0.55
    max-faces: 10000
